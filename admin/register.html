<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register for MKAY Apartments CMS</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      body { align-items: center; background: #111827; color: #fff; display: flex; font-family: Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 440px; }
      h1 { color: #d4af37; }
      button { background: #d4af37; border: 0; border-radius: 999px; color: #111827; cursor: pointer; font-size: 1rem; font-weight: 700; margin: 16px 0; padding: 14px 22px; }
      a { color: #d4af37; }
    </style>
  </head>
  <body>
    <main>
      <h1>MKAY Apartments CMS</h1>
      <p>Create an account to access the content management system.</p>
      <button type="button" onclick="netlifyIdentity.open('signup')">Create CMS Account</button>
      <p>Already registered? <a href="./">Sign in to the CMS</a></p>
    </main>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('signup', () => window.netlifyIdentity.close());
        window.netlifyIdentity.on('login', () => { document.location.href = './'; });
      }
    </script>
  </body>
</html>
